name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  reality-check-and-build:
    name: Reality Check & Invariant Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Reality Check Verification Harness
        run: |
          python tests/reality_check_harness.py

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Run Rust Non-Linear State Engine
        run: |
          cargo run --release
